<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechPrep | Advanced Interview Questions</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css?v=9">
</head>
<body>

    <!-- Sidebar Navigation -->
    <!-- Mobile Top Bar -->
    <div class="mobile-topbar">
        <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="brand mobile-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            TechPrep
        </div>
        <div style="width:40px;"></div>
    </div>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header-row">
            <div class="brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                TechPrep
            </div>
            <button class="sidebar-close" id="sidebarClose" aria-label="Close menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>

        <div class="search-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchInput" placeholder="Search scenarios...">
        </div>

        <div class="nav-section">
            <div class="nav-title">Type</div>
            <div class="diff-filters" id="typeFilters">
                <button class="diff-pill active" data-type="all">All</button>
                <button class="diff-pill" data-type="scenario">Scenario</button>
                <button class="diff-pill" data-type="standard">Standard</button>
            </div>
        </div>

        <div class="nav-section" style="flex: 1; display: flex; flex-direction: column; overflow: hidden; margin-bottom: 1.5rem;">
            <div class="nav-title">Technical Domains</div>
            <div id="navTopics" class="sidebar-scrollable" style="display: flex; flex-direction: column; gap: 0.25rem;">
                <!-- Populated via JS -->
            </div>
        </div>

        <div class="nav-section" style="margin-bottom: 0;">
            <div class="nav-title">Difficulty Level</div>
            <div class="diff-filters" id="diffFilters">
                <button class="diff-pill active" data-diff="all">All</button>
                <button class="diff-pill" data-diff="easy">Easy</button>
                <button class="diff-pill" data-diff="medium">Med</button>
                <button class="diff-pill" data-diff="hard">Hard</button>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="theme-switch" id="themeSwitch">
                <div class="theme-switch-bg"></div>
                <button class="theme-switch-btn active" id="btnDark">🌙</button>
                <button class="theme-switch-btn" id="btnLight">☀️</button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main">
        <header class="header">
            <h1 id="pageTitle">All Topics</h1>
            <p id="pageDesc">Explore thousands of high-quality, real-world technical scenarios.</p>
            <div class="stats-row" id="statsRow">
                <!-- Stats populated via JS -->
            </div>
        </header>

        <section class="content">
            <div class="q-grid" id="qGrid">
                <!-- Questions populated via JS -->
            </div>
            
            <div class="pagination" id="pagination">
                <!-- Pagination populated via JS -->
            </div>
        </section>
    </main>

    <!-- Selection Bar -->
    <div class="selection-bar" id="selectionBar">
        <div class="selection-info">
            <span id="selCount" style="font-weight: 700; color: var(--accent);">0</span> questions selected
            <button id="clearSelBtn" style="background:transparent; border:none; color:var(--text-tertiary); cursor:pointer; font-size:0.85rem; margin-left:0.5rem; text-decoration:underline;">Clear</button>
        </div>
        <div class="selection-actions">
            <button class="nav-btn" id="exportCandBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Export for Candidate
            </button>
            <button class="nav-btn" id="exportIntBtn" style="background: var(--accent); color: white; border-color: var(--accent);">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Export for Interviewer
            </button>
        </div>
    </div>

    <!-- Question Detail Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <div class="modal-header-left">
                    <span id="modalTopic" class="q-topic">Topic</span>
                    <span id="modalDiff" class="q-diff">Difficulty</span>
                </div>
                <button class="modal-close" id="modalClose">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="modal-q" id="modalQ"></div>
                <div class="modal-a">
                    <h4>Expected Answer / Strategy</h4>
                    <div id="modalA"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="nav-btn" id="prevBtn">← Previous</button>
                <span id="modalCounter" style="color: var(--text-muted); font-size: 0.875rem;"></span>
                <button class="nav-btn" id="nextBtn">Next →</button>
            </div>
        </div>
    </div>

    <!-- Data Scripts -->
    <script src="data/javascript.js"></script>
    <script src="data/typescript.js"></script>
    <script src="data/api.js"></script>
    <script src="data/angular.js"></script>
    <script src="data/react.js"></script>
    <script src="data/aws.js"></script>
    <script src="data/dsa.js"></script>
    <script src="data/debugging.js"></script>
    <script src="data/systemdesign.js"></script>
    <script src="data/security.js"></script>
    <script src="data/performance.js"></script>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>
</html>
